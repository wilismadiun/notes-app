name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developers
          POSTGRES_PASSWORD: password
          POSTGRES_DB: notesapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U developers -d notesapp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Create .test.env
        run: |
          cat <<EOF > .test.env
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=developers
          DB_PASSWORD=password
          DB_NAME=notesapp_test
          DB_SSLMODE=disable
          DB_TIMEZONE=Asia/Jakarta
          EOF

      - name: Run Goose migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "host=localhost port=5432 user=developers password=password dbname=notesapp_test sslmode=disable"
        run: goose -dir migrations up

      - name: Run tests
        run: go test ./...
  
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build image
        run: docker build -t notes-app:v1.0 .

      - name: Push repository docker
        run: docker push ${{ secrets.DOCKER_USERNAME }}/notes-app:v1.0 